<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agencia de Viajes - Clima Europeo</title>
    <link rel="stylesheet" href="css/master.css">
</head>
<body>
    <div id="particles-js"></div>

    <header>
        <h1 class="titulo-principal">EUROPEAN TRAVEL AGENCY</h1>
        <p class="subtitulo">PRONÓSTICO METEOROLÓGICO DE 7 DÍAS</p>
    </header>

    <main class="panel-cristal">
        <section class="control-usuario">
            <h2>CONSULTA PARA: <span id="nombre-ciudad-actual">[DESTINO]</span></h2>
            <div class="selector-wrapper">
                <select id="selector-ciudades" aria-label="Seleccionar ciudad europea">
                    <option value="">Cargando destinos...</option>
                </select>
            </div>
        </section>

        <section id="contenedor-clima" class="fila-pronostico" aria-live="polite">
            <p class="mensaje-estado">Por favor, seleccione una ciudad para comenzar.</p>
        </section>
        
        <footer>
            <p class="creditos">Datos meteorológicos obtenidos vía 7Timer! API</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
